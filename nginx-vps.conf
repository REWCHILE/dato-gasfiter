# ==============================================================================
# CONFIGURACIÓN NGINX DE ALTO RENDIMIENTO - VPS DATO-GASFITER.CL
# Optimizado para PageSpeed 100/100, Caché Agresivo en RAM y HTTP/2
# ==============================================================================

# Redirección canónica 301: www -> non-www
server {
    listen 80;
    listen [::]:80;
    server_name www.dato-gasfiter.cl;
    return 301 https://dato-gasfiter.cl$request_uri;
}

# Bloque principal
server {
    listen 80;
    listen [::]:80;
    server_name dato-gasfiter.cl;

    # Raíz del proyecto en el VPS
    root /var/www/dato-gasfiter;
    index index.html index.htm;

    charset utf-8;

    # --------------------------------------------------------------------------
    # 1. OPTIMIZACIÓN DE RENDIMIENTO EN MEMORIA RAM (VELOCIDAD MÁXIMA)
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Caché de descriptores de archivos en RAM (reduce I/O en disco a casi 0)
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --------------------------------------------------------------------------
    # 2. COMPRESIÓN GZIP ULTRA LIVIANA
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # 3. CABECERAS DE SEGURIDAD
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=()" always;

    # --------------------------------------------------------------------------
    # 4. REDIRECCIONES CANÓNICAS LIMPIAS (SEO)
    # --------------------------------------------------------------------------
    location = /index {
        return 301 /;
    }

    location = /index.html {
        return 301 /;
    }

    # Redirección de URLs antiguas sin '24-7'
    location = /gasfiter-emergencia-24-7 {
        return 301 /gasfiter-emergencia-urgencias;
    }

    location = /gasfiter-emergencia-24-7.html {
        return 301 /gasfiter-emergencia-urgencias;
    }

    # --------------------------------------------------------------------------
    # 5. ENLACES LIMPIOS (SIN EXTENSIÓN .HTML)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 6. CACHÉ DE ARCHIVOS ESTÁTICOS (1 AÑO INMUTABLE + GZIP ESTÁTICO EN RAM)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        gzip_static on;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Documentos HTML: Caché inteligente en Cloudflare Edge (s-maxage) y navegador fresco (max-age=0)
    location ~* \.(?:html|htm)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400";
    }

    # --------------------------------------------------------------------------
    # 7. ARCHIVOS CRÍTICOS Y SEGURIDAD
    # --------------------------------------------------------------------------
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ~* ^/(llms?|llms?-full|full-?llm)\.txt$ {
        allow all;
        default_type text/plain;
        charset utf-8;
        access_log off;
    }

    # Bloquear acceso a archivos ocultos (.git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
}
