# ==============================================================================
# CONFIGURACIÓN NGINX PARA DATO-GASFITER.CL
# Optimizado para alto rendimiento, URLs limpias, compresión y caché de estáticos
# ==============================================================================

# ------------------------------------------------------------------------------
# REDIRECCIÓN 301 CANÓNICA: www -> non-www (Resuelve error SEO contenido duplicado)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.dato-gasfiter.cl;
    return 301 https://dato-gasfiter.cl$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name dato-gasfiter.cl;
    
    # Raíz del proyecto
    root /laragon/www/dato-gasfiter;
    index index.html index.htm;

    # Codificación por defecto
    charset utf-8;

    # --------------------------------------------------------------------------
    # OPTIMIZACIÓN DE RENDIMIENTO NGINX
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --------------------------------------------------------------------------
    # COMPRESIÓN GZIP
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # --------------------------------------------------------------------------
    # CABECERAS DE SEGURIDAD
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=()" always;

    # --------------------------------------------------------------------------
    # REDIRECCIÓN 301 DE /INDEX HACIA LA RAÍZ / (CANÓNICA LIMPIA)
    # --------------------------------------------------------------------------
    location = /index {
        return 301 /;
    }

    location = /index.html {
        return 301 /;
    }

    # --------------------------------------------------------------------------
    # ENLACES LIMPIOS (REWRITE SIN EXTENSIÓN .HTML)
    # Permite navegar a /servicios o /nosotros directamente
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # CACHÉ DE ARCHIVOS ESTÁTICOS (IMÁGENES, CSS, JS, FUENTES)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Archivos HTML: no guardar en caché para actualizaciones instantáneas de contenido
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # --------------------------------------------------------------------------
    # ARCHIVOS SEO CRÍTICOS
    # --------------------------------------------------------------------------
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Protocolo de LLMs e Inteligencia Artificial
    location ~* ^/(llms?|llms?-full|full-?llm)\.txt$ {
        allow all;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Protocolo de Agentes de IA y WebMCP (ARD / ai-catalog.json / ard.json)
    location ~* ^/(\.well-known/)?(ai-catalog|ard)\.json$ {
        allow all;
        default_type application/ai-catalog+json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location ~* ^/(\.well-known/)?mcp\.json$ {
        allow all;
        default_type application/mcp-server-card+json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location ^~ /.well-known/ {
        allow all;
        default_type application/json;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Proteger archivos ocultos (.git, .env, etc.) excepto .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Página 404 personalizada
    error_page 404 /index.html;
}
